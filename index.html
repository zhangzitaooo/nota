<main id="top">
<section class="hero">
<div class="hero-copy"><h1>把论文读懂，<br>把<em>思考</em>留下。</h1>
<p>在 Mac 上对照中英文读论文。读到有意思的一句，<br class="wide">就在旁边写下批注，或带着原文继续追问。</p>
<a class="primary" href="#inside">看看怎么读 <span aria-hidden="true">↓</span></a></div>

<div class="pencil-note"><span>读到这里</span><img src="assets/nota.png" alt=""></div>
</div></section>
<section class="inside" id="inside">
<div class="section-title"><h2>在 Nota 里读论文</h2></div>
<div class="viewer">
<div class="modes" role="group" aria-label="查看不同功能的界面">
<button aria-pressed="true" data-mode="read">对照阅读</button><button aria-pressed="false" data-mode="note">页边批注</button><button aria-pressed="false" data-mode="ask">引用追问</button></div>
<figure><div class="frame" id="frame"><img id="shot" src="assets/read.webp" alt="Nota 阅读器，目录在左侧，语言切换位于正文上方"></div>
